<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/style.css" />
    <title>Comunidade | AluraDev</title>
  </head>
  <body>
    <header class="header">
      <img src="../assets/Logo.svg" />
      <input
        class="header_search"
        type="search"
        placeholder="Busque por algo"
        clear="false"
      />
      <div class="header_icons">
        <img src="../assets/Lupa.svg" id="iconSearch" />
        <img src="../assets/Menu.svg" id="buMenu" />
      </div>
      <a
        target="_blank"
        class="menu_link header_perfil"
        href="https://github.com/lupesii"
      >
        <img id="foto" src="../assets/Photo.png" />
        <label for="foto">Lucas</label>
      </a>
    </header>

    <main class="mainContainer">
      <nav class="menu" id="menu">
        <h1>MENU</h1>
        <a href="../index.html" class="menu_link notlinked">
          <img
            id="img-editor"
            class="icon_img --linked"
            src="../assets/Icone-Editor.svg"
            alt="Editor de Código"
          />
          <label>Editor de código</label>
        </a>

        <a href="../pages/comunidade.html" class="menu_link linked">
          <img
            id="img-comunidade"
            class="icon_img"
            src="../assets/Icone-Comunidade.svg"
            alt="Comunidade"
          />
          <label for="img-comunidade">Comunidade</label>
        </a>

        <hr />

        <a
          target="_blank"
          class="menu_link menu_user"
          href="https://github.com/lupesii"
        >
          <img id="foto" src="../assets/Photo.png" />
          <label for="foto">Lucas</label>
        </a>
      </nav>

      <ul class="area-cards">
        <li class="card-projeto">
          <section class="editorContainer" id="editorContainer">
            <code
              class="code_editor"
              contenteditable="false"
              aria-label="editor"
            ></code>
            <div class="dots">
              <span class="dot dot--red"></span>
              <span class="dot dot--yellow"></span>
              <span class="dot dot--green"></span>
            </div>
          </section>

          <section class="card__content">
            <div class="card__descricao">
              <h1 class="card__titulo">Titulo do card</h1>
              <p class="card__descricao">Essa é a descrição do meu card</p>
            </div>

            <div class="card__interacao">
              <div class="card__interacao-item">
                <img src="../assets/icone-coments.svg" alt="Ícone comentario" />
                <p>10</p>
              </div>
              <div class="card__interacao-item">
                <img src="../assets/icone-likes.svg" alt="Ícone likes" />
                <p>10</p>
              </div>
              <div class="card__interacao-item">
                <img src="" alt="" />
                <p></p>
              </div>
            </div>
          </section>
        </li>
      </ul>
    </main>

    <script src="../script/menu.js"></script>
  </body>
</html>
